<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>공 굴리기 게임</title>
    <style>
        body {
            background-color: #f5f5f5;
            margin: 0;
            padding: 20px;
            font-family: 'Comic Sans MS', 'Malgun Gothic', sans-serif;
            user-select: none;
            display: flex;
            justify-content: center;
        }

        .game-container {
            width: 800px;
            height: 600px;
            background-color: white;
            background-image: 
                linear-gradient(90deg, transparent 79px, #abced4 79px, #abced4 81px, transparent 81px),
                linear-gradient(#eee .1em, transparent .1em);
            background-size: 100% 1.2em;
            border: 2px solid #ccc;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            position: relative;
            overflow: hidden;
        }

        #level-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 100;
            padding-top: 30px;
            overflow-y: auto;
        }

        h1 { font-size: 3em; color: #333; margin-bottom: 10px; }
        .total-stars { font-size: 2em; font-weight: bold; margin-bottom: 30px; }

        .level-grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 15px;
            padding: 20px;
            padding-bottom: 50px;
        }

        .level-btn {
            width: 50px;
            height: 50px;
            border-radius: 10px;
            border: 2px solid #999;
            background: linear-gradient(to bottom, #f0f0f0, #ccc);
            font-size: 1.2em;
            font-weight: bold;
            color: #666;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
        }

        .level-btn.unlocked {
            background: linear-gradient(to bottom, #fff59d, #fbc02d);
            border-color: #f57f17;
            color: #3e2723;
        }
        .level-btn.unlocked:hover { transform: scale(1.1); }
        .level-btn.locked { cursor: not-allowed; opacity: 0.7; }

        #game-toolbar {
            display: none;
            position: absolute;
            top: 10px; left: 10px; right: 10px;
            background: rgba(255, 255, 255, 0.95);
            border: 2px solid #333;
            border-radius: 15px;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .btn {
            background-color: #00bcd4;
            color: white;
            border: 2px solid #00838f;
            padding: 5px 15px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 1.2em;
            cursor: pointer;
        }
        .btn:hover { background-color: #26c6da; }
        .btn.start { background-color: #4caf50; border-color: #2e7d32; }

        .ink-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 200px;
        }
        .ink-title { font-weight: bold; color: #d32f2f; margin-bottom: 5px; }
        .ink-bar-bg {
            width: 100%; height: 15px;
            background-color: #ddd;
            border-radius: 10px;
            border: 2px solid #333;
            overflow: hidden;
        }
        #ink-bar {
            width: 100%; height: 100%;
            background-color: #d32f2f;
            transition: width 0.1s;
        }

        canvas {
            display: none;
            width: 100%;
            height: 100%;
            cursor: crosshair;
        }

        #result-modal {
            display: none;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 350px;
            background-color: #fcf9f2; 
            background-image: linear-gradient(rgba(0,0,0,0.03) 1px, transparent 1px);
            background-size: 100% 30px;
            border: 3px solid #777;
            border-radius: 15px;
            box-shadow: 10px 10px 20px rgba(0,0,0,0.4);
            z-index: 50;
            text-align: center;
            padding: 30px 20px;
        }

        #result-title {
            font-size: 1.8em;
            color: #555;
            margin: 0 0 10px 0;
            text-shadow: 1px 1px 0px #fff;
        }

        #result-subtitle {
            font-size: 2.8em;
            color: #5c6bc0;
            margin: 10px 0 20px 0;
            font-style: italic;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        #result-stars {
            font-size: 3.5em;
            color: #ffca28;
            margin-bottom: 20px;
            text-shadow: 1px 1px 2px #333;
        }

        .result-buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }

        .result-btn {
            background-color: #e6ee9c;
            border: 2px solid #333;
            border-radius: 25px;
            padding: 10px 20px;
            font-size: 1.3em;
            font-weight: bold;
            color: #333;
            cursor: pointer;
            box-shadow: 3px 3px 0px #333;
            transition: all 0.1s;
        }

        .result-btn:active {
            transform: translate(3px, 3px);
            box-shadow: 0px 0px 0px #333;
        }
    </style>
</head>
<body>

    <div class="game-container">
        
        <div id="level-screen">
            <h1>공 굴리기</h1>
            <div class="total-stars">Total: <span id="total-stars">0</span> ⭐</div>
            <div class="level-grid" id="level-grid"></div>
        </div>

        <div id="game-toolbar">
            <button class="btn" onclick="showMenu()">Menu</button>
            <div class="ink-container">
                <div class="ink-title">Ink meter</div>
                <div class="ink-bar-bg"><div id="ink-bar"></div></div>
            </div>
            <div>
                <button class="btn" onclick="clearLines()">Erase</button>
                <button class="btn start" id="start-drop-btn" onclick="startDrop()">Start!</button>
            </div>
        </div>

        <canvas id="game-canvas" width="800" height="600"></canvas>
        
        <div id="result-modal">
            <h2 id="result-title">LEVEL 1 COMPLETE!</h2>
            <h3 id="result-subtitle">Perfect!!!</h3>
            <div id="result-stars">⭐⭐⭐</div>
            <div class="result-buttons">
                <button class="result-btn" onclick="retryLevel()">Retry!</button>
                <button class="result-btn" onclick="nextLevel()">Next!</button>
                <button class="result-btn" onclick="showMenu()">Levels!</button>
            </div>
        </div>

    </div>

    <script>
        const levelData = {
            1: { ball: {x: 100, y: 150}, goal: {x: 600, y: 500}, stars: [{x: 350, y: 250}, {x: 500, y: 400}], ink: 1000 },
            2: { ball: {x: 150, y: 150}, goal: {x: 150, y: 500}, stars: [{x: 400, y: 250}, {x: 600, y: 300}, {x: 400, y: 400}], ink: 1500 },
            3: { ball: {x: 700, y: 150}, goal: {x: 100, y: 500}, stars: [{x: 500, y: 250}, {x: 300, y: 300}, {x: 200, y: 250}], ink: 1200 }
        };

        const TOTAL_LEVELS = 100;
        let unlockedLevel = 1; 
        let currentLevel = 1;

        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        
        let isDrawing = false;
        let lines = []; 
        let cupLines = []; 
        let currentLine = [];
        let maxInk = 1000;
        let currentInk = 1000;
        
        let gameState = 'drawing'; 
        let animationId;

        let ball = { x: 0, y: 0, vx: 0, vy: 0, radius: 15 };
        let goal = { x: 0, y: 0, width: 80, height: 80 }; 
        let stars = [];
        let collectedStars = 0;
        let totalCollectedStars = 0; 

        const levelScreen = document.getElementById('level-screen');
        const gameToolbar = document.getElementById('game-toolbar');
        const resultModal = document.getElementById('result-modal');
        const inkBar = document.getElementById('ink-bar');
        const levelGrid = document.getElementById('level-grid');
        const startBtn = document.getElementById('start-drop-btn');

        function initLevelMenu() {
            levelGrid.innerHTML = '';
            for (let i = 1; i <= TOTAL_LEVELS; i++) {
                const btn = document.createElement('button');
                btn.className = `level-btn ${i <= unlockedLevel ? 'unlocked' : 'locked'}`;
                
                if (i <= unlockedLevel) {
                    btn.textContent = i;
                    btn.onclick = () => {
                        if(levelData[i]) loadLevel(i);
                        else alert(`${i}단계는 선생님이 아직 문제를 내고 계십니다!`);
                    };
                } else {
                    btn.innerHTML = '🔒';
                }
                levelGrid.appendChild(btn);
            }
            document.getElementById('total-stars').textContent = totalCollectedStars;
        }

        function showMenu() {
            cancelAnimationFrame(animationId);
            canvas.style.display = 'none';
            gameToolbar.style.display = 'none';
            resultModal.style.display = 'none';
            levelScreen.style.display = 'flex';
            initLevelMenu();
        }

        function loadLevel(levelNum) {
            currentLevel = levelNum;
            const data = levelData[levelNum];
            
            ball.x = data.ball.x; ball.y = data.ball.y;
            ball.vx = 0; ball.vy = 0;
            
            goal.x = data.goal.x; goal.y = data.goal.y;
            
            cupLines = [[
                {x: goal.x, y: goal.y}, 
                {x: goal.x, y: goal.y + goal.height}, 
                {x: goal.x + goal.width, y: goal.y + goal.height}, 
                {x: goal.x + goal.width, y: goal.y} 
            ]];

            stars = data.stars.map(s => ({ x: s.x, y: s.y, collected: false, radius: 15 }));
            collectedStars = 0;

            maxInk = data.ink;
            currentInk = maxInk;
            lines = [];
            currentLine = [];
            gameState = 'drawing';
            
            updateInkBar();
            startBtn.disabled = false;
            startBtn.style.opacity = '1';

            levelScreen.style.display = 'none';
            resultModal.style.display = 'none';
            canvas.style.display = 'block';
            gameToolbar.style.display = 'flex';

            drawFrame(); 
        }

        canvas.addEventListener('mousedown', (e) => {
            if (gameState !== 'drawing' || currentInk <= 0) return;
            isDrawing = true;
            const rect = canvas.getBoundingClientRect();
            currentLine = [{ x: e.clientX - rect.left, y: e.clientY - rect.top }];
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!isDrawing) return;
            const rect = canvas.getBoundingClientRect();
            const newPos = { x: e.clientX - rect.left, y: e.clientY - rect.top };
            
            const lastPos = currentLine[currentLine.length - 1];
            const dist = Math.hypot(newPos.x - lastPos.x, newPos.y - lastPos.y);
            
            if (currentInk - dist > 0) {
                currentInk -= dist;
                currentLine.push(newPos);
                updateInkBar();
                drawFrame(); 
            } else {
                isDrawing = false; 
                lines.push([...currentLine]);
            }
        });

        canvas.addEventListener('mouseup', () => {
            if (isDrawing) {
                isDrawing = false;
                if (currentLine.length > 1) lines.push([...currentLine]);
            }
        });
        
        canvas.addEventListener('mouseleave', () => {
            if (isDrawing) {
                isDrawing = false;
                if (currentLine.length > 1) lines.push([...currentLine]);
            }
        });

        function clearLines() {
            if(gameState !== 'drawing') return;
            lines = [];
            currentInk = maxInk;
            updateInkBar();
            drawFrame();
        }

        function updateInkBar() {
            inkBar.style.width = `${(currentInk / maxInk) * 100}%`;
        }

        function startDrop() {
            if (gameState !== 'drawing') return;
            gameState = 'playing';
            startBtn.disabled = true;
            startBtn.style.opacity = '0.5';
            gameLoop();
        }

        function gameLoop() {
            if (gameState !== 'playing') return;

            updatePhysics();
            drawFrame();

            if (ball.y > canvas.height + 50 || ball.x < -50 || ball.x > canvas.width + 50) {
                gameState = 'drawing';
                loadLevel(currentLevel); 
                return;
            }

            animationId = requestAnimationFrame(gameLoop);
        }

        function updatePhysics() {
            ball.vy += 0.15; 
            ball.vx *= 0.99;
            ball.vy *= 0.99;

            ball.x += ball.vx;
            ball.y += ball.vy;

            const allPhysicsLines = lines.concat(cupLines);

            for (let line of allPhysicsLines) {
                for (let i = 0; i < line.length - 1; i++) {
                    let p1 = line[i];
                    let p2 = line[i+1];
                    
                    let dx = p2.x - p1.x;
                    let dy = p2.y - p1.y;
                    let len = Math.hypot(dx, dy);
                    let dot = (((ball.x - p1.x) * dx) + ((ball.y - p1.y) * dy)) / (len * len);
                    
                    let closestX = p1.x + dot * dx;
                    let closestY = p1.y + dot * dy;
                    
                    if (dot >= 0 && dot <= 1) {
                        let dist = Math.hypot(ball.x - closestX, ball.y - closestY);
                        if (dist < ball.radius) {
                            let overlap = ball.radius - dist;
                            let nx = (ball.x - closestX) / dist;
                            let ny = (ball.y - closestY) / dist;
                            
                            ball.x += nx * overlap;
                            ball.y += ny * overlap;
                            
                            let vdot = ball.vx * nx + ball.vy * ny;
                            
                            ball.vx -= 1.2 * vdot * nx;
                            ball.vy -= 1.2 * vdot * ny;
                        }
                    }
                }
            }

            for (let star of stars) {
                if (!star.collected) {
                    let dist = Math.hypot(ball.x - star.x, ball.y - star.y);
                    if (dist < ball.radius + star.radius) {
                        star.collected = true;
                        collectedStars++;
                    }
                }
            }

            // 💡 수정됨: 공이 컵 안쪽에 들어와서 '바닥'에 닿았을 때만 클리어
            if (ball.x > goal.x + ball.radius && 
                ball.x < goal.x + goal.width - ball.radius &&
                ball.y + ball.radius >= goal.y + goal.height - 5) { 
                levelComplete();
            }
        }

        function drawFrame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = '#1565c0';
            ctx.lineWidth = 8;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.beginPath();
            ctx.moveTo(goal.x, goal.y);
            ctx.lineTo(goal.x, goal.y + goal.height);
            ctx.lineTo(goal.x + goal.width, goal.y + goal.height);
            ctx.lineTo(goal.x + goal.width, goal.y);
            ctx.stroke();

            ctx.fillStyle = '#ffeb3b';
            ctx.strokeStyle = '#f57f17';
            ctx.lineWidth = 2;
            for (let star of stars) {
                if (!star.collected) {
                    drawStar(star.x, star.y, 5, star.radius, star.radius / 2);
                }
            }

            ctx.strokeStyle = '#333'; 
            ctx.lineWidth = 5;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            for (let line of lines) {
                ctx.beginPath();
                ctx.moveTo(line[0].x, line[0].y);
                for (let i = 1; i < line.length; i++) {
                    ctx.lineTo(line[i].x, line[i].y);
                }
                ctx.stroke();
            }

            if (isDrawing && currentLine.length > 0) {
                ctx.beginPath();
                ctx.moveTo(currentLine[0].x, currentLine[0].y);
                for (let i = 1; i < currentLine.length; i++) {
                    ctx.lineTo(currentLine[i].x, currentLine[i].y);
                }
                ctx.stroke();
            }

            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fillStyle = '#004d40';
            ctx.fill();
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            ctx.beginPath();
            ctx.arc(ball.x - 4, ball.y - 4, 3, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255,255,255,0.5)';
            ctx.fill();
        }

        function drawStar(cx, cy, spikes, outerRadius, innerRadius) {
            let rot = Math.PI / 2 * 3;
            let x = cx;
            let y = cy;
            let step = Math.PI / spikes;

            ctx.beginPath();
            ctx.moveTo(cx, cy - outerRadius);
            for (let i = 0; i < spikes; i++) {
                x = cx + Math.cos(rot) * outerRadius;
                y = cy + Math.sin(rot) * outerRadius;
                ctx.lineTo(x, y);
                rot += step;

                x = cx + Math.cos(rot) * innerRadius;
                y = cy + Math.sin(rot) * innerRadius;
                ctx.lineTo(x, y);
                rot += step;
            }
            ctx.lineTo(cx, cy - outerRadius);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
        }

        function levelComplete() {
            if (gameState === 'ended') return; 
            gameState = 'ended';
            
            totalCollectedStars += collectedStars;
            
            document.getElementById('result-title').textContent = `LEVEL ${currentLevel} COMPLETE!`;
            
            let subtitle = 'Clear!';
            if (collectedStars === 3) subtitle = 'Perfect!!!';
            else if (collectedStars === 2) subtitle = 'Great!!';
            else if (collectedStars === 1) subtitle = 'Good!';
            document.getElementById('result-subtitle').textContent = subtitle;

            let starsHtml = '';
            for(let i=0; i<3; i++) {
                starsHtml += i < collectedStars ? '⭐' : '☆';
            }
            document.getElementById('result-stars').textContent = starsHtml;
            
            if (currentLevel === unlockedLevel && unlockedLevel < TOTAL_LEVELS) {
                unlockedLevel++;
            }

            resultModal.style.display = 'block';
        }

        function retryLevel() {
            resultModal.style.display = 'none';
            loadLevel(currentLevel);
        }

        function nextLevel() {
            resultModal.style.display = 'none';
            if (levelData[currentLevel + 1]) {
                loadLevel(currentLevel + 1);
            } else {
                alert('다음 단계는 준비 중입니다!');
                showMenu();
            }
        }

        initLevelMenu();

    </script>
</body>
</html>
