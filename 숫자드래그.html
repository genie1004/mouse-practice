<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>숫자 3개 조합 게임</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; text-align: center; background: #f0f8ff; padding: 20px; }
        #mission { font-size: 2.5em; margin-bottom: 20px; }
        #target { color: #ff4500; font-weight: bold; }
        #board { display: flex; justify-content: center; align-items: center; gap: 15px; margin: 20px auto; padding: 20px; border: 3px dashed #4682b4; width: 300px; height: 100px; border-radius: 15px; background: white; }
        #numbers { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; margin-top: 30px; padding: 20px; border: 2px solid #ccc; border-radius: 15px; background: #e9ecef; }
        .num { width: 60px; height: 60px; line-height: 60px; background: #4682b4; color: white; border-radius: 10px; cursor: grab; font-size: 24px; font-weight: bold; user-select: none; }
        #status { font-size: 1.5em; font-weight: bold; margin-top: 20px; height: 50px; }
        #next-btn { display: none; font-size: 2em; cursor: pointer; color: #28a745; margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="mission">미션: 숫자 <span id="target"></span>을 만드세요 (3개 선택)!</div>
    <div id="status">조합된 숫자: 0개</div>
    
    <div id="board" ondrop="drop(event)" ondragover="allowDrop(event)"></div>
    <div id="numbers" ondrop="drop(event)" ondragover="allowDrop(event)"></div>
    
    <div id="next-btn" onclick="startNewGame()">▶ 다음 문제</div>

    <script>
        let target, currentSum;

        function startNewGame() {
            target = Math.floor(Math.random() * 11) + 10; // 10 ~ 20
            document.getElementById('target').innerText = target;
            document.getElementById('status').innerText = "조합된 숫자: 0개";
            document.getElementById('next-btn').style.display = "none";
            
            const board = document.getElementById('board');
            const container = document.getElementById('numbers');
            board.innerHTML = "";
            container.innerHTML = "";
            
            for (let i = 1; i <= 9; i++) {
                let div = document.createElement('div');
                div.className = 'num';
                div.id = 'num-' + i;
                div.innerText = i;
                div.draggable = true;
                div.ondragstart = (ev) => ev.dataTransfer.setData("text", ev.target.id);
                container.appendChild(div);
            }
        }

        function allowDrop(ev) { ev.preventDefault(); }

        function drop(ev) {
            ev.preventDefault();
            let data = ev.dataTransfer.getData("text");
            let el = document.getElementById(data);
            let board = document.getElementById('board');
            
            // 보드에 숫자가 3개 미만일 때만 드롭 허용
            if (ev.target.closest('#board') && board.children.length < 3) {
                board.appendChild(el);
            } else if (ev.target.closest('#numbers')) {
                document.getElementById('numbers').appendChild(el);
            }
            calculateResult();
        }

        function calculateResult() {
            let board = document.getElementById('board').children;
            let sum = 0;
            for (let child of board) { sum += parseInt(child.innerText); }
            
            let status = document.getElementById('status');
            status.innerText = `조합된 숫자: ${board.length}개 (합계: ${sum})`;

            if (board.length === 3) {
                if (sum === target) {
                    status.innerText = `성공! ${sum}이 맞습니다!`;
                    document.getElementById('next-btn').style.display = "block";
                } else {
                    status.innerText = `합계가 ${sum}입니다. 3개를 다 채웠지만 정답이 아니에요!`;
                }
            }
        }

        startNewGame();
    </script>
</body>
</html>
