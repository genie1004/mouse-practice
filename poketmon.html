<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>포켓몬 메모리 게임</title>
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            background-color: #f8f9fa;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
            user-select: none;
        }

        /* 상단 헤더 영역 (제목, 상태, 버튼) */
        .header {
            width: 100%;
            max-width: 900px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #e9ecef;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .header h1 {
            margin: 0;
            color: #2c3e50;
            font-size: 2.2em;
        }

        .stats {
            display: flex;
            align-items: center;
            gap: 20px;
            font-size: 1.2em;
            font-weight: bold;
            color: #000;
        }

        .stats span {
            color: #1a73e8; /* 파란색 강조 */
        }

        .restart-btn {
            background-color: #2962ff;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1em;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .restart-btn:hover {
            background-color: #1565c0;
        }

        /* 6x4 카드 그리드 배열 */
        .grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 15px;
            max-width: 900px;
            width: 100%;
        }

        /* 개별 카드 스타일 */
        .card {
            width: 100%;
            aspect-ratio: 1 / 1; /* 정사각형 유지 */
            position: relative;
            cursor: pointer;
            transform-style: preserve-3d;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .card:active {
            transform: scale(0.95);
            transition: transform 0.1s;
        }

        /* 카드가 뒤집혔을 때의 클래스 */
        .card.flip {
            transform: rotateY(180deg);
        }

        /* 카드의 앞면과 뒷면 공통 속성 */
        .front-face, .back-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden; /* 뒤집히면 뒷면이 안 보이게 */
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        /* 카드 앞면 (포켓몬 그림) */
        .front-face {
            background-color: white;
            border: 3px solid #e0e0e0;
            transform: rotateY(180deg);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            box-sizing: border-box;
        }

        .front-face img {
            width: 90%;
            height: 90%;
            object-fit: contain;
        }

        /* 카드 뒷면 (몬스터볼 CSS 드로잉) */
        .back-face {
            background: linear-gradient(to bottom, #f44336 50%, #ffffff 50%);
            border: 4px solid #212121;
            position: relative;
            box-sizing: border-box;
        }

        /* 몬스터볼 검은 띠 */
        .back-face::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 6px;
            background-color: #212121;
            transform: translateY(-50%);
        }

        /* 몬스터볼 가운데 동그라미 버튼 */
        .back-face::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 25%;
            height: 25%;
            background-color: #ffffff;
            border: 5px solid #212121;
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }

        /* 클리어 축하 메시지 */
        #clear-message {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
            z-index: 100;
            border: 5px solid #ffcb05;
        }

        #clear-message h2 {
            color: #f44336;
            font-size: 3em;
            margin: 0 0 10px 0;
        }
        
        #clear-message p {
            font-size: 1.5em;
            font-weight: bold;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>포켓몬 메모리 게임</h1>
        <div class="stats">
            <div>이동: <span id="moves">0</span></div>
            <div>시간: <span id="time">0</span>초</div>
            <button class="restart-btn" onclick="initGame()">다시 시작</button>
        </div>
    </div>

    <div class="grid" id="grid">
        </div>

    <div id="clear-message">
        <h2>🎉 대성공! 🎉</h2>
        <p>모든 포켓몬을 찾았어요!</p>
        <button class="restart-btn" style="font-size: 1.5em;" onclick="initGame()">다시 하기</button>
    </div>

    <script>
        const grid = document.getElementById('grid');
        const movesDisplay = document.getElementById('moves');
        const timeDisplay = document.getElementById('time');
        const clearMessage = document.getElementById('clear-message');

        // 사용할 12마리의 포켓몬 도감 번호 (공식 고화질 일러스트 사용)
        // 1(이상해씨), 4(파이리), 7(꼬부기), 25(피카츄), 39(푸린), 54(고라파덕)
        // 94(팬텀), 133(이브이), 143(잠만보), 149(망나뇽), 150(뮤츠), 151(뮤)
        const pokemonIds = [1, 4, 7, 25, 39, 54, 94, 133, 143, 149, 150, 151];
        
        let cards = [];
        let hasFlippedCard = false;
        let lockBoard = false;
        let firstCard, secondCard;
        
        let moves = 0;
        let matchedPairs = 0;
        
        let time = 0;
        let timer;
        let isPlaying = false;

        // 게임 초기화 및 시작
        function initGame() {
            grid.innerHTML = '';
            clearMessage.style.display = 'none';
            cards = [];
            
            hasFlippedCard = false;
            lockBoard = false;
            firstCard = null;
            secondCard = null;
            
            moves = 0;
            matchedPairs = 0;
            movesDisplay.textContent = moves;
            
            clearInterval(timer);
            time = 0;
            timeDisplay.textContent = time;
            isPlaying = false;

            // 12쌍의 카드(총 24장) 배열 만들기
            let cardDeck = [...pokemonIds, ...pokemonIds];
            
            // 배열 랜덤하게 섞기
            cardDeck.sort(() => Math.random() - 0.5);

            // HTML에 카드 요소 생성해서 넣기
            cardDeck.forEach(id => {
                const card = document.createElement('div');
                card.classList.add('card');
                card.dataset.id = id;

                // 포켓몬 고화질 이미지 URL
                const imgUrl = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${id}.png`;

                card.innerHTML = `
                    <div class="front-face">
                        <img src="${imgUrl}" alt="Pokemon ${id}">
                    </div>
                    <div class="back-face"></div>
                `;

                card.addEventListener('click', flipCard);
                grid.appendChild(card);
            });
        }

        // 타이머 시작
        function startTimer() {
            if (!isPlaying) {
                isPlaying = true;
                timer = setInterval(() => {
                    time++;
                    timeDisplay.textContent = time;
                }, 1000);
            }
        }

        // 카드 뒤집기 로직
        function flipCard() {
            startTimer(); // 첫 번째 클릭 시 타이머 시작

            // 클릭 잠금 상태이거나, 방금 누른 카드를 또 눌렀을 때 무시
            if (lockBoard) return;
            if (this === firstCard) return;

            this.classList.add('flip'); // 애니메이션 실행

            if (!hasFlippedCard) {
                // 첫 번째 카드 뒤집음
                hasFlippedCard = true;
                firstCard = this;
                return;
            }

            // 두 번째 카드 뒤집음
            secondCard = this;
            moves++;
            movesDisplay.textContent = moves;
            
            checkForMatch();
        }

        // 짝이 맞는지 확인
        function checkForMatch() {
            let isMatch = firstCard.dataset.id === secondCard.dataset.id;

            if (isMatch) {
                disableCards();
            } else {
                unflipCards();
            }
        }

        // 짝이 맞았을 때 (카드 비활성화)
        function disableCards() {
            firstCard.removeEventListener('click', flipCard);
            secondCard.removeEventListener('click', flipCard);

            matchedPairs++;
            
            // 12쌍을 다 맞췄다면 게임 클리어!
            if (matchedPairs === 12) {
                clearInterval(timer);
                setTimeout(() => {
                    clearMessage.style.display = 'block';
                }, 500);
            }

            resetBoard();
        }

        // 짝이 틀렸을 때 (잠시 후 다시 뒤집기)
        function unflipCards() {
            lockBoard = true; // 잠시 동안 다른 카드 클릭 못하게 막음

            // 아이들이 외울 수 있게 1초 정도 보여준 뒤 뒤집음
            setTimeout(() => {
                firstCard.classList.remove('flip');
                secondCard.classList.remove('flip');
                resetBoard();
            }, 1000);
        }

        // 턴 초기화
        function resetBoard() {
            [hasFlippedCard, lockBoard] = [false, false];
            [firstCard, secondCard] = [null, null];
        }

        // 웹페이지가 켜지면 바로 게임 세팅
        initGame();
    </script>
</body>
</html>
