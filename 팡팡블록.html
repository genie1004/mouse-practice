<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>팡팡 블록 터뜨리기</title>
    <style>
        body { text-align: center; font-family: 'Malgun Gothic', sans-serif; background: #2c3e50; color: white; }
        
        #status-bar {
            width: 800px; margin: 10px auto; padding: 10px;
            background: #34495e; border-radius: 5px; display: flex;
            justify-content: space-between; font-weight: bold;
        }

        #game-board { 
            display: grid; gap: 1px; margin: 0 auto; 
            background: #34495e; border: 5px solid #34495e;
            width: fit-content;
        }
        .block { width: 30px; height: 30px; cursor: pointer; border-radius: 2px; }

        #controls { margin-top: 15px; }
        .btn { padding: 10px 30px; font-size: 1.2em; cursor: pointer; background: #e74c3c; color: white; border: none; border-radius: 5px; }
    </style>
</head>
<body>

    <div id="status-bar">
        <span>팡팡 블록 터뜨리기 : 같은 색 블록을 더블클릭하세요!</span>
        <span id="score-display">점수: 0</span>
    </div>

    <div id="game-board"></div>

    <div id="controls">
        <button class="btn" onclick="initBoard()">새 게임</button>
    </div>

    <script>
        const ROWS = 20, COLS = 25; 
        const COLORS = ['#f1c40f', '#e67e22', '#e74c3c', '#3498db', '#2ecc71'];
        let board = [];
        let score = 0;

        function initBoard() {
            score = 0;
            document.getElementById('score-display').textContent = "점수: 0";
            const boardEl = document.getElementById('game-board');
            boardEl.style.gridTemplateColumns = `repeat(${COLS}, 30px)`;
            boardEl.innerHTML = '';
            board = [];
            
            for (let r = 0; r < ROWS; r++) {
                board[r] = [];
                for (let c = 0; c < COLS; c++) {
                    const color = COLORS[Math.floor(Math.random() * COLORS.length)];
                    board[r][c] = color;
                    const div = document.createElement('div');
                    div.className = 'block';
                    div.style.backgroundColor = color;
                    div.id = `b-${r}-${c}`;
                    // 💡 [핵심] onclick 대신 ondblclick으로 변경!
                    div.ondblclick = () => handleBlockClick(r, c);
                    boardEl.appendChild(div);
                }
            }
        }

        function handleBlockClick(r, c) {
            const color = board[r][c];
            if (!color) return;
            
            let toRemove = [];
            function findGroup(r, c, col) {
                if (r < 0 || r >= ROWS || c < 0 || c >= COLS || board[r][c] !== col || toRemove.find(b => b.r === r && b.c === c)) return;
                toRemove.push({r, c});
                findGroup(r + 1, c, col); findGroup(r - 1, c, col);
                findGroup(r, c + 1, col); findGroup(r, c - 1, col);
            }
            
            findGroup(r, c, color);
            
            if (toRemove.length >= 2) {
                score += (toRemove.length * 10);
                document.getElementById('score-display').textContent = "점수: " + score;
                
                toRemove.forEach(b => board[b.r][b.c] = null);
                applyGravity();
                render();
            }
        }

        function applyGravity() {
            for (let c = 0; c < COLS; c++) {
                let writeR = ROWS - 1;
                for (let readR = ROWS - 1; readR >= 0; readR--) {
                    if (board[readR][c] !== null) {
                        board[writeR][c] = board[readR][c];
                        if (writeR !== readR) board[readR][c] = null;
                        writeR--;
                    }
                }
            }
        }

        function render() {
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const block = document.getElementById(`b-${r}-${c}`);
                    block.style.backgroundColor = board[r][c] || 'transparent';
                    block.style.cursor = board[r][c] ? 'pointer' : 'default';
                }
            }
        }
        initBoard();
    </script>
</body>
</html>
