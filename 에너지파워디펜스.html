<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>더블클릭 디펜스!</title>
    <style>
        body { margin: 0; background: #1a1a1a; color: white; text-align: center; overflow: hidden; font-family: sans-serif; }
        #tower { width: 100px; height: 100px; background: #3498db; border-radius: 50%; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); border: 5px solid white; z-index: 10; }
        .monster { width: 40px; height: 40px; background: #e74c3c; border-radius: 50%; position: absolute; cursor: pointer; transition: transform 0.2s; }
        .monster.slowed { background: #f1c40f; transform: scale(0.8); }
        #health { font-size: 24px; margin-top: 10px; }
    </style>
</head>
<body>
    <div id="health">타워 에너지: 100</div>
    <div id="tower"></div>
    <div id="game-area"></div>

    <script>
        let health = 100;
        const gameArea = document.getElementById('game-area');
        const healthDisplay = document.getElementById('health');

        function createMonster() {
            const m = document.createElement('div');
            m.className = 'monster';
            let angle = Math.random() * Math.PI * 2;
            let startX = window.innerWidth / 2 + Math.cos(angle) * 400;
            let startY = window.innerHeight / 2 + Math.sin(angle) * 400;
            m.style.left = startX + 'px';
            m.style.top = startY + 'px';

            // 클릭 시 멈춤(슬로우), 더블클릭 시 삭제
            m.onclick = (e) => {
                if (m.classList.contains('slowed')) {
                    m.remove(); // 더블클릭(슬로우 상태에서 클릭)
                } else {
                    m.classList.add('slowed'); // 슬로우
                }
            };

            let moveInterval = setInterval(() => {
                let rect = m.getBoundingClientRect();
                let dx = window.innerWidth / 2 - rect.left;
                let dy = window.innerHeight / 2 - rect.top;
                let speed = m.classList.contains('slowed') ? 0.5 : 2;
                m.style.left = rect.left + (dx / Math.sqrt(dx*dx + dy*dy)) * speed + 'px';
                m.style.top = rect.top + (dy / Math.sqrt(dx*dx + dy*dy)) * speed + 'px';

                if (Math.abs(dx) < 50 && Math.abs(dy) < 50) {
                    health -= 10;
                    healthDisplay.innerText = "타워 에너지: " + health;
                    m.remove();
                    clearInterval(moveInterval);
                    if(health <= 0) alert("게임 오버!");
                }
            }, 50);
            gameArea.appendChild(m);
        }

        setInterval(createMonster, 1500);
    </script>
</body>
</html>
