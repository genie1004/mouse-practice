<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>과일 자르기</title>
    <style>
        body {
            background-color: #e8f5e9;
            text-align: center;
            font-family: 'Malgun Gothic', sans-serif;
            margin-top: 30px;
            user-select: none; 
            overflow: hidden; 
            touch-action: none;
        }
        h1 { color: #2e7d32; font-size: 3em; margin-bottom: 10px; }
        .score-board { font-size: 2em; font-weight: bold; color: #1b5e20; margin-bottom: 20px; }
        .score-board span { display: inline-block; transition: transform 0.2s; }
        
        /* 과일을 자를 커다란 도마 */
        .game-area {
            position: relative;
            width: 800px;
            height: 500px;
            background-color: #d7ccc8;
            border: 15px solid #8d6e63;
            border-radius: 20px;
            margin: 0 auto;
            overflow: hidden;
            background-image: linear-gradient(rgba(0,0,0,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(0,0,0,0.05) 1px, transparent 1px);
            background-size: 20px 20px;
            cursor: crosshair; 
            box-shadow: 0 10px 20px rgba(0,0,0,0.2), inset 0 0 30px rgba(0,0,0,0.1);
        }

        /* 폭탄 터질 때 빨간 화면 깜빡임 */
        @keyframes flashRed {
            0% { background-color: #d7ccc8; }
            30% { background-color: #ff5252; }
            100% { background-color: #d7ccc8; }
        }
        .flash-danger {
            animation: flashRed 0.5s ease-out;
        }

        /* 아이템(과일/폭탄) 틀 */
        .item {
            position: absolute;
            width: 90px;
            height: 90px;
            font-size: 80px;
            bottom: -100px;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 튀어오르는 애니메이션 */
        @keyframes flyUp {
            0% { bottom: -100px; transform: translateX(0) rotate(0deg); }
            50% { bottom: var(--jump-height); transform: translateX(calc(var(--drift) / 2)) rotate(180deg); }
            100% { bottom: -100px; transform: translateX(var(--drift)) rotate(360deg); }
        }

        /* 폭탄 부들부들 애니메이션 */
        @keyframes shake {
            0% { transform: rotate(0deg); }
            25% { transform: rotate(-10deg); }
            50% { transform: rotate(0deg); }
            75% { transform: rotate(10deg); }
            100% { transform: rotate(0deg); }
        }
        .bomb-icon {
            display: inline-block;
            animation: shake 0.3s infinite;
        }

        /* 폭발 효과 */
        .explosion {
            font-size: 150px; 
            animation: boom 0.4s ease-out forwards;
        }
        @keyframes boom {
            0% { transform: scale(0.5); opacity: 1; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1.5); opacity: 0; }
        }

        /* ----- 두 동강 난 과일 조각 설정 ----- */
        .half {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            /* 여기서 var(--slice-angle)을 받아 각도대로 회전시킵니다 */
            transform: rotate(var(--slice-angle)); 
        }

        .half-emoji {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            transform: rotate(calc(var(--slice-angle) * -1));
        }

        .top-half {
            clip-path: polygon(0 0, 100% 0, 100% 50%, 0 50%);
            animation: dropTop 0.6s ease-in forwards;
        }
        .bottom-half {
            clip-path: polygon(0 50%, 100% 50%, 100% 100%, 0 100%);
            animation: dropBottom 0.6s ease-in forwards;
        }

        @keyframes dropTop {
            0% { transform: rotate(var(--slice-angle)) translate(0, 0); }
            100% { transform: rotate(var(--slice-angle)) translate(0, -120px) rotate(20deg); opacity: 0; }
        }
        @keyframes dropBottom {
            0% { transform: rotate(var(--slice-angle)) translate(0, 0); }
            100% { transform: rotate(var(--slice-angle)) translate(0, 120px) rotate(-20deg); opacity: 0; }
        }

        /* 자르는 궤적(검기) */
        .sword-trail {
            position: absolute;
            background-color: white;
            height: 4px;
            border-radius: 2px;
            pointer-events: none;
            z-index: 100;
            box-shadow: 0 0 10px white, 0 0 5px cyan;
            opacity: 0;
            transform-origin: left center;
        }
    </style>
</head>
<body>

    <h1>🍉 쓱싹쓱싹 과일 자르기 🍉</h1>
    <div class="score-board">점수: <span id="score">0</span>점</div>
    <p>마우스 <b>왼쪽 버튼을 꾹 누른 채로</b> 과일을 자르세요! (💣 <b>폭탄은 피하세요!</b>)</p>

    <div class="game-area" id="game-area">
        <div class="sword-trail" id="sword-trail"></div>
    </div>

    <script>
        const gameArea = document.getElementById('game-area');
        const scoreDisplay = document.getElementById('score');
        const swordTrail = document.getElementById('sword-trail');
        let score = 0;
        
        let isMouseDown = false;
        let prevMouseX = 0;
        let prevMouseY = 0;
        let sliceAngle = 0;

        gameArea.addEventListener('mousedown', (e) => {
            isMouseDown = true;
            recordMousePos(e);
            swordTrail.style.opacity = 1;
        });
        
        document.addEventListener('mouseup', () => {
            isMouseDown = false;
            swordTrail.style.opacity = 0;
        });
        
        gameArea.addEventListener('mouseleave', () => {
            isMouseDown = false;
            swordTrail.style.opacity = 0;
        });

        gameArea.addEventListener('mousemove', (e) => {
            if (isMouseDown) {
                const rect = gameArea.getBoundingClientRect();
                const mouseX = e.clientX - rect.left;
                const mouseY = e.clientY - rect.top;

                const dx = mouseX - prevMouseX;
                const dy = mouseY - prevMouseY;
                
                if (Math.abs(dx) > 2 || Math.abs(dy) > 2) {
                    sliceAngle = Math.atan2(dy, dx) * (180 / Math.PI);
                    
                    const distance = Math.sqrt(dx*dx + dy*dy);
                    swordTrail.style.width = distance + 'px';
                    swordTrail.style.left = prevMouseX + 'px';
                    swordTrail.style.top = prevMouseY + 'px';
                    swordTrail.style.transform = `rotate(${sliceAngle}deg)`;
                }

                prevMouseX = mouseX;
                prevMouseY = mouseY;
            }
        });

        function recordMousePos(e) {
            const rect = gameArea.getBoundingClientRect();
            prevMouseX = e.clientX - rect.left;
            prevMouseY = e.clientY - rect.top;
        }

        const fruitList = ['🍉', '🍎', '🍌', '🥝', '🍊', '🍍', '🍑', '🍓'];

        function spawnItem() {
            const item = document.createElement('div');
            item.className = 'item';
            
            const isBomb = Math.random() < 0.2; 
            const itemEmoji = isBomb ? '💣' : fruitList[Math.floor(Math.random() * fruitList.length)];
            
            const itemEmojiDiv = document.createElement('div');
            itemEmojiDiv.className = 'whole-item';
            itemEmojiDiv.textContent = itemEmoji;
            
            if (isBomb) {
                itemEmojiDiv.classList.add('bomb-icon');
            }
            
            item.appendChild(itemEmojiDiv);

            const startPos = 10 + Math.random() * 70;
            item.style.left = startPos + '%';

            const jumpHeight = 250 + Math.random() * 100; 
            item.style.setProperty('--jump-height', jumpHeight + 'px');

            const drift = (Math.random() - 0.5) * 200;
            item.style.setProperty('--drift', drift + 'px');

            item.style.animation = `flyUp 3s cubic-bezier(0.2, 0.8, 0.3, 1) forwards`;

            gameArea.appendChild(item);

            item.addEventListener('mouseenter', (e) => {
                if (isMouseDown && !item.classList.contains('sliced')) {
                    item.classList.add('sliced'); 

                    if (isBomb) {
                        score = Math.max(0, score - 3); 
                        scoreDisplay.textContent = score;
                        
                        gameArea.classList.remove('flash-danger');
                        void gameArea.offsetWidth; 
                        gameArea.classList.add('flash-danger');

                        scoreDisplay.style.color = 'red';
                        scoreDisplay.style.transform = 'scale(1.5)';
                        setTimeout(() => {
                            scoreDisplay.style.color = '#1b5e20';
                            scoreDisplay.style.transform = 'scale(1)';
                        }, 300);

                        itemEmojiDiv.textContent = '💥';
                        itemEmojiDiv.classList.remove('bomb-icon');
                        itemEmojiDiv.className = 'explosion';
                        
                        item.style.animationPlayState = 'paused';

                        setTimeout(() => {
                            if (item.parentElement) item.remove();
                        }, 400);

                    } else {
                        score += 1;
                        scoreDisplay.textContent = score;

                        itemEmojiDiv.style.display = 'none';
                        
                        const appliedAngle = sliceAngle + 90;
                        // ✅ 수정된 부분: px 단위 대신 각도 단위인 deg를 사용합니다!
                        item.style.setProperty('--slice-angle', appliedAngle + 'deg'); 

                        const topHalf = document.createElement('div');
                        topHalf.className = 'half top-half';
                        const topEmoji = document.createElement('div');
                        topEmoji.className = 'half-emoji';
                        topEmoji.textContent = itemEmoji;
                        topHalf.appendChild(topEmoji);

                        const bottomHalf = document.createElement('div');
                        bottomHalf.className = 'half bottom-half';
                        const bottomEmoji = document.createElement('div');
                        bottomEmoji.className = 'half-emoji';
                        bottomEmoji.textContent = itemEmoji;
                        bottomHalf.appendChild(bottomEmoji);

                        item.appendChild(topHalf);
                        item.appendChild(bottomHalf);
                        
                        item.style.animationPlayState = 'paused';

                        setTimeout(() => {
                            if (item.parentElement) item.remove();
                        }, 600);
                    }
                }
            });

            setTimeout(() => {
                if (item.parentElement && !item.classList.contains('sliced')) {
                    item.remove();
                }
            }, 3000);
        }

        setInterval(spawnItem, 900);
    </script>
</body>
</html>
